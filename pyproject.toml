[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensaver"
version = "0.4.0"
description = "Condense AI prompts before sending them, and track token & cost savings. CLI + proxy library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["ai", "llm", "tokens", "cost", "claude", "openai", "cli", "prompt", "proxy"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Accurate token counts (recommended). Without it, counts are estimated.
accurate = ["tiktoken>=0.5"]

[project.scripts]
tokensaver = "tokensaver.cli:main"
tokensave = "tokensaver.cli:main_short"

[project.urls]
Homepage = "https://github.com/yourname/tokensaver"
Issues = "https://github.com/yourname/tokensaver/issues"

[tool.setuptools]
packages = ["tokensaver"]
